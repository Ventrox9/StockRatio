name: Daten aktualisieren & Seite veröffentlichen

on:
  schedule:
    # Mo–Fr 22:17 UTC – nach US-Börsenschluss (Europa/Asien sind dann ebenfalls geschlossen)
    - cron: "17 22 * * 1-5"
  workflow_dispatch: # manuell starten: Actions -> dieser Workflow -> "Run workflow"
  # bei JEDEM Push neu veröffentlichen – auch bei reinen README-Änderungen. Steht GitHub Pages noch auf
  # "Deploy from a branch", würde sonst GitHubs eigener Build die README als Startseite veröffentlichen.
  push:

permissions:
  contents: write # Signal-Verlauf im Branch "signals"
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # GitHub Pages veröffentlicht nur vom Standard-Branch
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: pip install -r requirements.txt

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q

      - id: pages
        uses: actions/configure-pages@v5

      - name: Aktienliste aktualisieren (S&P 500, MSCI World, Watchlist)
        # Fällt eine Quelle aus, bleibt die Liste aus data/universe.csv erhalten.
        continue-on-error: true
        run: python -m stockratio.universe

      - name: Kennzahlen von Yahoo Finance laden & Score berechnen
        env:
          # Aktien, die heute nicht geladen werden können, kommen aus dem letzten Stand.
          PREVIOUS_DATA: ${{ steps.pages.outputs.base_url }}/data/stocks.json
        run: python -m stockratio.build --workers 6

      - name: Signal-Verlauf fortschreiben (Branch signals → data/signals.json)
        # Fehler hier verhindern nicht die Veröffentlichung – der Verlauf geht dabei nicht verloren.
        continue-on-error: true
        run: |
          set +e; git ls-remote --exit-code --heads origin signals >/dev/null; rc=$?; set -e
          if [ "$rc" -eq 0 ]; then
            git fetch --depth=1 origin signals
            git worktree add --detach signals FETCH_HEAD
            parent="-p $(git rev-parse FETCH_HEAD)"
          elif [ "$rc" -eq 2 ]; then
            # erster Lauf: leerer Verlauf (Analysten-Signale der letzten 3 Monate werden rekonstruiert)
            git worktree add --detach signals HEAD
            git -C signals rm -rq .
            parent=""
          else
            echo "::error::Branch signals nicht erreichbar – Verlauf wird nicht verändert"; exit 1
          fi
          python -m stockratio.signals --stocks site/data/stocks.json --state signals/signals.json --out site/data/signals.json
          git -C signals add -A
          tree=$(git -C signals write-tree)
          commit=$(git -C signals -c user.name="github-actions[bot]" -c user.email="41898299+github-actions[bot]@users.noreply.github.com" \
            commit-tree "$tree" $parent -m "Signale $(date -u +'%Y-%m-%d %H:%M') UTC")
          git -C signals push -q origin "$commit:refs/heads/signals"

      - name: Cache-Busting (CSS/JS-Version = Commit + Datenstand)
        run: |
          VERSION="${GITHUB_SHA::8}-$(date -u +%Y%m%d%H%M)"
          sed -i "s/__VERSION__/${VERSION}/g" site/index.html site/sw.js
          grep -o 'v=[^"]*' site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
